name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment (skip tests)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18.x'
  PNPM_VERSION: '8.x'
  CACHE_VERSION: v1
  REGISTRY: https://registry.npmjs.org/

jobs:
  # 代码质量检查
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    outputs:
      should-continue: ${{ steps.changes.outputs.src == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for file changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          src:
            - 'src/**'
            - 'tests/**'
            - 'package*.json'
            - 'tsconfig*.json'
            - 'vite.config.*'
            - 'vitest.config.*'
            - '.eslintrc.*'
            - '.prettierrc.*'

    - name: Setup Node.js
      if: steps.changes.outputs.src == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      if: steps.changes.outputs.src == 'true'
      run: npm ci --prefer-offline --no-audit

    - name: Type check
      if: steps.changes.outputs.src == 'true'
      run: npm run type-check

    - name: ESLint check
      if: steps.changes.outputs.src == 'true'
      run: npm run lint -- --format=json --output-file=eslint-report.json

    - name: Prettier check
      if: steps.changes.outputs.src == 'true'
      run: npm run format:check

    - name: Circular dependencies check
      if: steps.changes.outputs.src == 'true'
      run: npx madge --circular src/ --json > circular-deps.json || true

    - name: Upload ESLint report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: eslint-report
        path: eslint-report.json
        retention-days: 7

    - name: Upload circular dependencies report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: circular-deps
        path: circular-deps.json
        retention-days: 7

  # 单元测试
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-check
    if: needs.quality-check.outputs.should-continue == 'true'
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Run integration tests
      run: npm run test:integration

    - name: Generate coverage report
      run: npm run coverage:report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.node-version }}
        path: |
          coverage/
          coverage-report.html
        retention-days: 7

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const lines = coverage.total.lines.pct;
            const functions = coverage.total.functions.pct;
            const branches = coverage.total.branches.pct;
            const statements = coverage.total.statements.pct;

            const comment = `## 📊 Test Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Lines | ${lines}% |
            | Functions | ${functions}% |
            | Branches | ${branches}% |
            | Statements | ${statements}% |

            ${lines >= 80 ? '✅' : '⚠️'} Coverage is ${lines >= 80 ? 'good' : 'below 80%'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Coverage report not found');
          }

  # 可访问性测试
  accessibility-test:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: quality-check
    if: needs.quality-check.outputs.should-continue == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Build application
      run: npm run build

    - name: Run accessibility tests
      run: npm run test:a11e

    - name: Generate accessibility report
      run: npm run a11e:report

    - name: Upload accessibility report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: accessibility-report
        path: |
          accessibility-report/
          .a11y/
        retention-days: 30

    - name: Comment PR with accessibility results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('accessibility-report/violations.json', 'utf8'));
            const violations = report.violations.length;

            const comment = `## ♿ Accessibility Test Results

            ${violations === 0 ? '✅' : '⚠️'} Found ${violations} accessibility violation(s)

            ${violations > 0 ? `
            <details>
            <summary>📋 Violation Details</summary>

            ${report.violations.slice(0, 10).map(v =>
              `- **${v.impact}**: ${v.description}`
            ).join('\n')}

            ${violations > 10 ? `\n... and ${violations - 10} more` : ''}

            </details>` : ''}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Accessibility report not found');
          }

  # 构建应用
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [quality-check, test, accessibility-test]
    if: needs.quality-check.outputs.should-continue == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        VITE_APP_ENV: production

    - name: Generate bundle analysis
      run: npm run analyze:bundle

    - name: Generate size stats
      run: npm run size:stats

    - name: Check bundle size budget
      run: npm run check:budget

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-files
        path: |
          dist/
          bundle-analysis-report.html
          size-stats.json
        retention-days: 30

    - name: Upload source maps
      uses: actions/upload-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        name: source-maps
        path: dist/*.map
        retention-days: 90

    - name: Comment PR with bundle analysis
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const stats = JSON.parse(fs.readFileSync('size-stats.json', 'utf8'));
            const totalSize = (stats.totalSize / 1024).toFixed(2);
            const gzippedSize = (stats.gzippedSize / 1024).toFixed(2);

            const comment = `## 📊 Bundle Analysis Report

            | Metric | Size |
            |--------|------|
            | Total Size | ${totalSize} KB |
            | Gzipped | ${gzippedSize} KB |
            | Chunks | ${stats.chunks} |
            | Assets | ${stats.assets} |

            ${totalSize <= 500 ? '✅' : '⚠️'} Bundle size is ${totalSize <= 500 ? 'within budget' : 'above 500KB budget'}

            <details>
            <summary>📋 Detailed Breakdown</summary>

            ${stats.chunkDetails?.map(chunk =>
              `- **${chunk.name}**: ${(chunk.size / 1024).toFixed(2)} KB`
            ).join('\n') || 'No chunk details available'}

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Bundle analysis report not found:', error.message);
          }

  # E2E测试
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event.inputs.environment != ''
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-files
        path: ./dist

    - name: Install Playwright
      run: npx playwright install --with-deps ${{ matrix.browser }}

    - name: Run E2E tests
      run: npm run test:e2e -- --project=${{ matrix.browser }}
      env:
        BASE_URL: http://localhost:3000

    - name: Start application
      run: |
        npm install -g serve
        serve -s dist -l 3000 &
        sleep 10

    - name: Run E2E tests against built app
      run: npm run test:e2e:ci -- --project=${{ matrix.browser }}

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-results-${{ matrix.browser }}
        path: |
          test-results/
          playwright-report/
          test-results.xml
        retention-days: 7

    - name: Upload E2E videos
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: e2e-videos-${{ matrix.browser }}
        path: test-results/
        retention-days: 7

  # 安全审计
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality-check
    if: needs.quality-check.outputs.should-continue == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Run npm audit
      run: npm audit --audit-level high

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: javascript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

    - name: Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.7.0
      if: github.ref == 'refs/heads/main'
      with:
        target: 'http://localhost:3000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

  # 性能测试
  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-files
        path: ./dist

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Start application
      run: |
        npm install -g serve
        serve -s dist -l 3000 &
        sleep 10

    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli@0.12.x
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}
        LHCI_SERVER_URL: ${{ secrets.LHCI_SERVER_URL }}
        LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
        LHCI_BUILD_CONTEXT__GITHUB_REPO_SLUG: ${{ github.repository }}

    - name: Performance budget check
      run: npm run check:budget

    - name: Upload Lighthouse report
      uses: actions/upload-artifact@v3
      with:
        name: lighthouse-report
        path: .lighthouseci/
        retention-days: 30

    - name: Comment PR with Lighthouse results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('.lighthouseci/lhr-report.json', 'utf8'));
            const performance = report.categories.performance.score * 100;
            const accessibility = report.categories.accessibility.score * 100;
            const bestPractices = report.categories['best-practices'].score * 100;
            const seo = report.categories.seo.score * 100;

            const comment = `## 🚀 Performance Test Results

            | Category | Score |
            |----------|-------|
            | Performance | ${performance.toFixed(0)}% |
            | Accessibility | ${accessibility.toFixed(0)}% |
            | Best Practices | ${bestPractices.toFixed(0)}% |
            | SEO | ${seo.toFixed(0)}% |

            ${performance >= 90 ? '✅' : '⚠️'} Performance is ${performance >= 90 ? 'excellent' : performance >= 50 ? 'needs improvement' : 'poor'}

            <details>
            <summary>📋 Detailed Metrics</summary>

            - First Contentful Paint: ${report.audits['first-contentful-paint'].displayValue}
            - Largest Contentful Paint: ${report.audits['largest-contentful-paint'].displayValue}
            - Cumulative Layout Shift: ${report.audits['cumulative-layout-shift'].displayValue}
            - Total Blocking Time: ${report.audits['total-blocking-time'].displayValue}

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Lighthouse report not found');
          }

  # 部署到预发布环境
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality-check, test, accessibility-test, build, performance-test, security-audit]
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.universe-life.com
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-files
        path: ./dist

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./
        alias-domains: |
          staging-universe-life.vercel.app

    - name: Run smoke tests
      run: npm run test:smoke
      env:
        TEST_URL: https://staging.universe-life.com

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: '🚀 Staging deployment completed'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # 部署到生产环境
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-check, test, accessibility-test, build, e2e-test, performance-test, security-audit]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://universe-life.com
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-files
        path: ./dist

    - name: Deploy to AWS S3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --follow-symlinks --delete --exclude "*.map"
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        SOURCE_DIR: 'dist'

    - name: Invalidate CloudFront
      uses: chetan/invalidate-cloudfront-action@v2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        DISTRIBUTION_ID: ${{ secrets.AWS_DISTRIBUTION_ID }}

    - name: Run production smoke tests
      run: npm run test:smoke
      env:
        TEST_URL: https://universe-life.com

    - name: Create release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          ## 🚀 Production Release v${{ github.run_number }}

          ### 📋 Changes
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Author**: ${{ github.actor }}

          ### 🏗️ Build Information
          - **Build Number**: ${{ github.run_number }}
          - **Build Time**: ${{ github.event.head_commit.timestamp }}
          - **Node Version**: ${{ env.NODE_VERSION }}

          ### ✅ Pre-deployment Checks
          - [x] Code Quality Tests
          - [x] Unit Tests
          - [x] Accessibility Tests
          - [x] E2E Tests
          - [x] Performance Tests
          - [x] Security Audit

          ### 📊 Metrics
          - **Bundle Size**: See bundle analysis report
          - **Performance Score**: See Lighthouse report
          - **Test Coverage**: See coverage report

          ---
          *This release was automatically deployed via GitHub Actions*
        draft: false
        prerelease: false

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: '🎉 Production deployment completed successfully!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # 清理工件
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v6
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });

          const oldArtifacts = artifacts.data.artifacts.filter(artifact => {
            const createdDate = new Date(artifact.created_at);
            const daysOld = (Date.now() - createdDate.getTime()) / (1000 * 60 * 60 * 24);
            return daysOld > 30;
          });

          for (const artifact of oldArtifacts) {
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
            });
          }

  # 通知汇总
  notify:
    name: Pipeline Notification
    runs-on: ubuntu-latest
    needs: [quality-check, test, accessibility-test, build, e2e-test, security-audit, deploy-staging, deploy-production]
    if: always()
    steps:
    - name: Prepare notification summary
      id: summary
      run: |
        QUALITY_STATUS="${{ needs.quality-check.result }}"
        TEST_STATUS="${{ needs.test.result }}"
        A11Y_STATUS="${{ needs.accessibility-test.result }}"
        BUILD_STATUS="${{ needs.build.result }}"
        E2E_STATUS="${{ needs.e2e-test.result }}"
        SECURITY_STATUS="${{ needs.security-audit.result }}"

        # Determine overall status
        if [[ "$QUALITY_STATUS" == "failure" || "$TEST_STATUS" == "failure" || "$A11Y_STATUS" == "failure" || "$BUILD_STATUS" == "failure" ]]; then
          OVERALL_STATUS="❌ FAILED"
        elif [[ "$E2E_STATUS" == "failure" || "$SECURITY_STATUS" == "failure" ]]; then
          OVERALL_STATUS="⚠️ PARTIAL SUCCESS"
        else
          OVERALL_STATUS="✅ SUCCESS"
        fi

        echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT

        echo "## 🚀 Pipeline Summary

        | Stage | Status |
        |-------|--------|
        | Code Quality | $QUALITY_STATUS |
        | Unit Tests | $TEST_STATUS |
        | Accessibility | $A11Y_STATUS |
        | Build | $BUILD_STATUS |
        | E2E Tests | $E2E_STATUS |
        | Security Audit | $SECURITY_STATUS |

        **Overall Status**: $OVERALL_STATUS

        **Commit**: ${{ github.sha }}
        **Branch**: ${{ github.ref_name }}
        **Triggered By**: ${{ github.actor }}" > summary.md

    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            text: "${{ steps.summary.outputs.overall_status }} Pipeline completed for ${{ github.repository }}",
            attachments: [{
              color: "${{ contains(steps.summary.outputs.overall_status, 'SUCCESS') && 'good' || contains(steps.summary.outputs.overall_status, 'PARTIAL') && 'warning' || 'danger' }}",
              fields: [{
                title: "Repository",
                value: "${{ github.repository }}",
                short: true
              }, {
                title: "Branch",
                value: "${{ github.ref_name }}",
                short: true
              }, {
                title: "Commit",
                value: "${{ github.sha }}",
                short: true
              }, {
                title: "Triggered By",
                value: "${{ github.actor }}",
                short: true
              }]
            }]
          }
        channel: '#ci-cd'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

    - name: Comment on PR/Commit
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('summary.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });