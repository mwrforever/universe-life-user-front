  </g>

  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">设计创作</text>
  <text x="200" y="250" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="Arial, sans-serif">UI设计 · 平面设计 · 视频剪辑</text>
