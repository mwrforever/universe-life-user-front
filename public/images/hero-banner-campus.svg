<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="campus-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52c41a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#73d13d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#campus-gradient)"/>

  <!-- Graduation Cap Icon -->
  <g transform="translate(200, 120)">
    <polygon points="-50,10 0,-20 50,10 40,15 0,25 -40,15" fill="rgba(255,255,255,0.2)"/>
    <rect x="-3" y="10" width="6" height="15" fill="rgba(255,255,255,0.3)"/>
    <circle cx="0" cy="-20" r="3" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">校园服务</text>
  <text x="200" y="250" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="Arial, sans-serif">论文指导 · 技能培训 · 实习推荐</text>
</svg>