<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gaming-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#gaming-gradient)"/>

  <!-- Game Controller Icon -->
  <g transform="translate(200, 150)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="rgba(255,255,255,0.2)"/>
    <circle cx="-30" cy="0" r="8" fill="rgba(255,255,255,0.4)"/>
    <circle cx="-10" cy="0" r="8" fill="rgba(255,255,255,0.4)"/>
    <circle cx="30" cy="0" r="8" fill="rgba(255,255,255,0.4)"/>
    <circle cx="50" cy="0" r="8" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">游戏竞技</text>
  <text x="200" y="250" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="Arial, sans-serif">专业代练 · 电竞陪练 · 游戏交易</text>
</svg>