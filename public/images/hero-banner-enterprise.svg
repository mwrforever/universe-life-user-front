<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="enterprise-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40a9ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#enterprise-gradient)"/>

  <!-- Building Icon -->
  <g transform="translate(200, 120)">
    <rect x="-40" y="-30" width="80" height="60" fill="rgba(255,255,255,0.2)"/>
    <rect x="-30" y="-20" width="15" height="15" fill="rgba(255,255,255,0.4)"/>
    <rect x="-10" y="-20" width="15" height="15" fill="rgba(255,255,255,0.4)"/>
    <rect x="10" y="-20" width="15" height="15" fill="rgba(255,255,255,0.4)"/>
    <rect x="-30" y="0" width="15" height="15" fill="rgba(255,255,255,0.4)"/>
    <rect x="-10" y="0" width="15" height="15" fill="rgba(255,255,255,0.4)"/>
    <rect x="10" y="0" width="15" height="15" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">企业服务</text>
  <text x="200" y="250" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="Arial, sans-serif">公司注册 · 财务代账 · 法律咨询</text>
</svg>